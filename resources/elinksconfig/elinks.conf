set mime.extension.jpg="image/jpeg"
set mime.extension.jpeg="image/jpeg"
set mime.extension.png="image/png"
set mime.extension.gif="image/gif"
set mime.extension.bmp="image/bmp"
set mime.extension.webp="image/webp"

set mime.handler.image_viewer.unix.ask = 1
set mime.handler.image_viewer.unix-xwin.ask = 0

set mime.handler.image_viewer.unix.block = 1
set mime.handler.image_viewer.unix-xwin.block = 0

set mime.handler.image_viewer.unix.program = "mpv %"
set mime.handler.image_viewer.unix-xwin.program = "mpv %"

set mime.type.image.jpg = "image_viewer"
set mime.type.image.jpeg = "image_viewer"
set mime.type.image.png = "image_viewer"
set mime.type.image.gif = "image_viewer"
set mime.type.image.bmp = "image_viewer"
set mime.type.image.webp = "image_viewer"


set mime.extension.mp3="audio/mpeg"
set mime.extension.ogg="audio/ogg"
set mime.extension.wav="audio/x-wav"
set mime.extension.flac="audio/flac"
set mime.extension.m4a="audio/mp4"

set mime.handler.audio_player.unix.ask = 1
#set mime.handler.audio_player.unix-xwin.ask = 0

set mime.handler.audio_player.unix.block = 1
#set mime.handler.audio_player.unix-xwin.block = 0

set mime.handler.audio_player.unix.program = "mpv --no-video %u"
#set mime.handler.audio_player.unix-xwin.program = "mpv --no-video %u"

set mime.type.audio.mpeg = "audio_player"
set mime.type.audio.ogg = "audio_player"
set mime.type.audio.x-wav = "audio_player"
set mime.type.audio.flac = "audio_player"
set mime.type.audio.mp4 = "audio_player"
